# Production / Coolify compose
# Coolify: attach your domain to `frontend` (container port 80). Do NOT publish host :80/:8080 here —
# Coolify/Traefik already owns public ports on the server.
#
# Local (ports + Vite HMR):
#   ./scripts/docker-up.sh
#   # or: docker compose -f docker-compose.yaml -f docker-compose.local.yaml up -d --build

services:
  db:
    image: public.ecr.aws/docker/library/postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-safetyuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safetypassword}
      POSTGRES_DB: ${POSTGRES_DB:-safetyapp_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-safetyuser} -d ${POSTGRES_DB:-safetyapp_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      BACKEND_PORT: 4000
      PORT: 4000
      APP_URL: ${APP_URL:-http://localhost:8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-${APP_URL:-http://localhost:8080}}
      # Default: compose `db`. Override in Coolify for an external Postgres.
      DATABASE_URL: ${DATABASE_URL:-postgresql://safetyuser:safetypassword@db:5432/safetyapp_db}
      # empty = auto (local off, managed hosts on). Set true/false to force.
      DATABASE_SSL: ${DATABASE_SSL:-}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-superadmin@sheq.local}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-SuperAdmin1!}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Super Admin}
      SUPERADMIN_COMPANY: ${SUPERADMIN_COMPANY:-Sitemate}
      SUPERADMIN_RESET: ${SUPERADMIN_RESET:-false}
    volumes:
      - backend_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    expose:
      - "4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NITRO_PORT: 3000
      # Browser calls same-origin /api (nginx → backend)
      VITE_API_URL: ${VITE_API_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    # Coolify proxies to this container port — do not bind host ports here.
    expose:
      - "80"

volumes:
  postgres_data:
  backend_data:
