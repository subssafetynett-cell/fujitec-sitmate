# Local development overlay — merge with docker-compose.yaml:
#   docker compose -f docker-compose.yaml -f docker-compose.local.yaml up -d --build
# Or use: ./scripts/docker-up.sh
#
# Do NOT use this overlay on Coolify / Hostinger.

services:
  db:
    ports:
      # 5435 avoids clashing with other local stacks / default Postgres on 5432
      - "5435:5432"

  backend:
    environment:
      NODE_ENV: development
      APP_URL: ${APP_URL:-http://localhost:8082}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8082}
      DATABASE_URL: ${DATABASE_URL:-postgresql://safetyuser:safetypassword@db:5432/safetyapp_db}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_API_PROXY_TARGET: http://backend:4000
    ports:
      - "${FRONTEND_PORT:-8082}:8080"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
